name: Build and deploy

# Same model as the landing pages: images are built on GitHub's runners and pushed to GitHub
# Container Registry; the VPS only pulls and restarts. It never compiles anything.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. A second run waits rather than cancelling one mid-flight, which could
# leave a half-replaced container.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Backend build and tests
        working-directory: backend
        run: dotnet test DoctorCrm.slnx -c Release

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend lint and type-check
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npx next typegen
          npx tsc --noEmit

  build:
    name: Build images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: backend
          - name: web
            context: frontend
    steps:
      - uses: actions/checkout@v4

      # GHCR image names must be lower-case; the repository name may not be.
      - name: Image name
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}-${{ matrix.name }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          # `latest` is what the server pulls; the SHA tag is what you roll back to.
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull and restart over SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          SITE_PATH: ${{ secrets.VPS_SITE_PATH }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          set -euo pipefail

          for v in SSH_KEY VPS_HOST VPS_USER SITE_PATH; do
            if [ -z "${!v}" ]; then
              echo "::error::Required secret is empty: ${v/SSH_KEY/VPS_SSH_KEY}"
              exit 1
            fi
          done

          mkdir -p ~/.ssh
          # printf keeps the trailing newline OpenSSH requires; tr drops Windows line endings that
          # creep in when the key is pasted from a Windows editor.
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # Validate the key locally first. Otherwise a malformed paste surfaces as a bare
          # "error in libcrypto" followed by a password prompt, which names neither cause nor fix.
          if ! ssh-keygen -y -f ~/.ssh/id_deploy >/dev/null 2>&1; then
            echo "::error::VPS_SSH_KEY is not a valid private key."
            echo "Paste the whole key, including the -----BEGIN OPENSSH PRIVATE KEY----- and"
            echo "-----END OPENSSH PRIVATE KEY----- lines, with no leading spaces on any line."
            echo "First line seen: $(head -c 36 ~/.ssh/id_deploy | tr -c '[:print:]' '?')"
            exit 1
          fi

          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i $HOME/.ssh/id_deploy -p $VPS_PORT -o ConnectTimeout=20 -o BatchMode=yes $VPS_USER@$VPS_HOST"

          # Two separate checks so each failure names its own cause.
          $SSH true || {
            echo "::error::SSH login to the VPS failed. Check VPS_HOST, VPS_USER and that VPS_SSH_KEY matches the deploy user's authorized key."
            exit 1
          }
          $SSH "test -d '$SITE_PATH' && test -f '$SITE_PATH/.env'" || {
            echo "::error::Site directory or its .env is missing on the server (VPS_SITE_PATH)."
            exit 1
          }

          # The compose file is a deploy artefact: shipped every time, so edits to it always arrive.
          scp -i ~/.ssh/id_deploy -P "$VPS_PORT" deploy/docker-compose.yml "$VPS_USER@$VPS_HOST:$SITE_PATH/docker-compose.yml"

          # The remote script arrives on stdin; its inputs are prepended with printf %q escaping.
          {
            printf 'SITE_PATH=%q\n'     "$SITE_PATH"
            printf 'GHCR_USERNAME=%q\n' "$GHCR_USERNAME"
            printf 'GHCR_PAT=%q\n'      "$GHCR_PAT"
            cat deploy/remote-deploy.sh
          } | $SSH 'bash -s'
